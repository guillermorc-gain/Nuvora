<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Nuvora</title>
  <style>
    @font-face { font-family: "Dancing Script"; src: url("fonts/dancing_script.ttf") format("truetype"); font-weight: 400 700; }
    :root {
      --bg: #F4F6FA; --surface: #FFFFFF; --text: #1A2233; --muted: #566173; --border: #E3E7EE;
      --primary: #1565C0; --tint: #DBE7FB; --danger: #C62828;
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0F131A; --surface: #181D26; --text: #E3E7EE; --muted: #AAB3C2; --border: #2A303B; --primary: #8AB4F8; --tint: #1B3A6B; --danger: #FF8A80; color-scheme: dark; }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font: 15px/1.5 system-ui, -apple-system, Roboto, sans-serif; color: var(--text);
      background: radial-gradient(700px 400px at 0% 0%, rgb(21 101 192 / .2), transparent 60%),
                  radial-gradient(600px 400px at 100% 100%, rgb(255 122 47 / .14), transparent 60%), var(--bg);
      display: grid; place-items: center; padding: 24px 16px;
    }
    .card { width: min(420px, 100%); background: var(--surface); border: 1px solid var(--border); border-radius: 22px; padding: 28px 22px; box-shadow: 0 8px 24px rgb(16 24 48 / .1); }
    .icon { width: 80px; height: 80px; display: block; margin: 0 auto; border-radius: 20px; box-shadow: 0 4px 14px rgb(16 24 48 / .15); }
    .logo { text-align: center; }
    .wordmark {
      font: 700 56px/1.1 "Dancing Script", cursive; padding: 0 .08em;
      background: linear-gradient(90deg, #1E3A8A, #6A3DE8 38%, #C2185B 70%, #FF7A2F);
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .reflejo { height: .42em; font-size: 56px; overflow: hidden; margin-top: -.14em; -webkit-mask-image: linear-gradient(rgb(0 0 0 / .45), transparent); }
    .reflejo .wordmark { display: block; transform: scaleY(-1); }
    p { color: var(--muted); margin: 6px 0 18px; text-align: center; }
    label { display: block; font-size: 13px; font-weight: 600; color: var(--muted); margin-bottom: 6px; }
    input {
      width: 100%; padding: 13px 14px; font: inherit; color: inherit; background: var(--surface);
      border: 1px solid var(--border); border-radius: 12px; outline: none;
    }
    input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--tint); }
    button {
      width: 100%; margin-top: 14px; padding: 13px; border: 0; border-radius: 999px; font: 600 15px system-ui, sans-serif;
      background: var(--primary); color: #fff; cursor: pointer;
    }
    @media (prefers-color-scheme: dark) { button { color: #002E6B; } }
    button:disabled { opacity: .6; }
    .error { color: var(--danger); font-size: 14px; margin: 12px 0 0; text-align: left; }
    .ayuda { margin-top: 18px; padding: 14px; border-radius: 14px; background: var(--tint); font-size: 13.5px; color: var(--text); }
    .ayuda b { display: block; margin-bottom: 4px; }
    code { font: 13px ui-monospace, monospace; }
  </style>
</head>
<body>
  <form class="card" id="f">
    <img class="icon" src="icon.svg" alt="">
    <div class="logo">
      <span class="wordmark">Nuvora</span>
      <div class="reflejo" aria-hidden="true"><span class="wordmark">Nuvora</span></div>
    </div>
    <p>Conecta la app con tu servidor Nuvora para ver, subir y compartir tus archivos.</p>
    <label for="url">Dirección del servidor</label>
    <input id="url" inputmode="url" autocomplete="url" autocapitalize="off" spellcheck="false" placeholder="192.168.1.20:3000" required>
    <div class="error" id="error" hidden></div>
    <button id="boton">Conectar</button>
    <div class="ayuda">
      <b>¿Dónde la encuentro?</b>
      En el ordenador donde funciona Nuvora, al ejecutar <code>npm start</code> aparece la línea
      «En el móvil: http://…». El móvil tiene que estar en la misma red wifi.
    </div>
  </form>
  <script>
    const q = new URLSearchParams(location.search);
    const input = document.getElementById('url');
    const boton = document.getElementById('boton');
    const caja = document.getElementById('error');
    if (q.get('url')) input.value = q.get('url').replace(/^http:\/\//, '');
    function mostrarError(msg) {
      caja.textContent = msg;
      caja.hidden = false;
      boton.disabled = false;
      boton.textContent = 'Conectar';
    }
    window.mostrarError = mostrarError;
    if (q.get('error')) mostrarError('No se pudo abrir el servidor. Comprueba que está encendido y que el móvil está en la misma red.');
    document.getElementById('f').addEventListener('submit', (e) => {
      e.preventDefault();
      caja.hidden = true;
      boton.disabled = true;
      boton.textContent = 'Conectando…';
      if (window.NuvoraApp) NuvoraApp.conectar(input.value);
      else mostrarError('Esta pantalla solo funciona dentro de la app Nuvora.');
    });
  </script>
</body>
</html>
