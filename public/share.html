<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#7C5CFF">
  <title>Nuvora · Archivo compartido</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
  <style>
    body { min-height: 100%; display: flex; flex-direction: column; }
    .pub-top { display: flex; align-items: center; gap: 12px; padding: 12px max(16px, env(safe-area-inset-right, 0px)) 12px max(16px, env(safe-area-inset-left, 0px)); color: #fff; background: linear-gradient(110deg, var(--head-1), var(--head-2) 55%, var(--head-3)); }
    .liso .pub-top { background: var(--head-1); }
    .pub-top .btn { margin-left: auto; background: rgb(255 255 255 / .16); border-color: rgb(255 255 255 / .3); color: #fff; }
    .pub-top .icon-btn { color: #fff; }
    .pub-main { padding-top: 20px !important; }
    .pub-main { flex: 1; width: min(1100px, 100%); margin: 0 auto; padding: 8px 16px 40px; }
    .pub-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-xl); box-shadow: var(--shadow); overflow: hidden; }
    .pub-head { display: flex; align-items: center; gap: 14px; padding: 18px 20px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
    .pub-head h1 { font-size: 19px; margin: 0; word-break: break-word; }
    .pub-head .grow { flex: 1; min-width: 200px; }
    .pub-stage { display: grid; place-items: center; background: #0d0e14; min-height: 320px; max-height: 75vh; }
    .pub-stage img, .pub-stage video { max-width: 100%; max-height: 75vh; display: block; }
    .pub-stage iframe { width: 100%; height: 75vh; border: 0; background: #fff; }
    .pub-stage pre { width: 100%; max-height: 75vh; overflow: auto; margin: 0; color: #e3e6f5; padding: 20px; font: 13px/1.6 ui-monospace, Menlo, monospace; white-space: pre-wrap; }
    .pub-stage audio { width: min(520px, 90%); margin: 40px 0; }
    .pub-stage .nopreview { color: #ccd; text-align: center; padding: 40px 16px; }
    .pub-stage .nopreview .ico { width: 64px; height: 64px; stroke-width: 1.2; }
    .pub-list { padding: 4px 8px 12px; }
    .pub-row { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: var(--r-md); cursor: pointer; }
    .pub-row:hover { background: var(--hover); }
    .pub-row .n { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .crumbs { font-size: 14px; padding: 10px 12px 0; }
    .center-card { width: min(400px, 100%); margin: 8vh auto; text-align: center; background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-xl); padding: 28px; box-shadow: var(--shadow); }
    .center-card .ico { width: 44px; height: 44px; color: var(--primary); }
    footer.pub-foot { text-align: center; padding: 20px; color: var(--muted); font-size: 12.5px; }
  </style>
</head>
<body>
  <header class="pub-top">
    <a class="brand" href="/" aria-label="Nuvora"><img src="/icon.svg" alt=""><span class="wordmark on-head">Nuvora</span></a>
    <button class="icon-btn" id="theme-btn" title="Cambiar tema" aria-label="Cambiar tema"></button>
    <a class="btn" href="/">Crear cuenta gratis</a>
  </header>
  <main class="pub-main" id="root"><p class="muted">Cargando…</p></main>
  <footer class="pub-foot">Compartido con <b>Nuvora</b> · tus archivos en la nube</footer>
  <div id="toasts" class="toasts"></div>
  <div id="modal-root"></div>
  <script src="/common.js"></script>
  <script src="/share.js"></script>
</body>
</html>
