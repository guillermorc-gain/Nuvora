name: Publicar versión

on:
  push:
    branches: [main, 'ccr-832ba140-viul7f']
    # Lo que no cambia la app (el README, etc.) no crea versión nueva
    paths:
      - 'server/**'
      - 'public/**'
      - 'sync/**'
      - 'scripts/**'
      - 'test/**'
      - 'package.json'
      - 'package-lock.json'
      - 'android/**'
      - '.github/workflows/publicar.yml'
  # A mano: Actions → «Publicar versión» → Run workflow
  workflow_dispatch:

# Dos pushes seguidos se publican uno detrás de otro, nunca a la vez
concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      numero: ${{ steps.version.outputs.numero }}

    steps:
      - uses: actions/checkout@v4
        with:
          # Todo el historial y las etiquetas: para numerar la versión y escribir las novedades
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Si las pruebas fallan no se publica nada
      - run: npm test

      - name: Número de versión
        id: version
        run: |
          ULTIMA=$(git tag -l 'v0.*' | sed 's/^v0\.//' | sort -n | tail -1)
          N=$(( ${ULTIMA:-0} + 1 ))
          echo "tag=v0.$N" >> "$GITHUB_OUTPUT"
          echo "numero=$N" >> "$GITHUB_OUTPUT"
          echo "anterior=${ULTIMA:+v0.$ULTIMA}" >> "$GITHUB_OUTPUT"
          echo "Nueva versión: v0.$N"

      # El ZIP ya lleva node_modules: se descomprime y se arranca con «npm start»
      - name: Preparar el ZIP
        run: |
          V="${{ steps.version.outputs.tag }}"
          npm version --no-git-tag-version --allow-same-version "${V#v}.0"
          rm -rf dist && mkdir -p dist/Nuvora
          cp -r server public sync scripts package.json package-lock.json README.md dist/Nuvora/
          cp -r node_modules dist/Nuvora/
          # El servidor saca de aquí el ID de Google (proyecto de Firebase «Nuvora»)
          if [ -f android/app/google-services.json ]; then cp android/app/google-services.json dist/Nuvora/; fi
          cd dist && zip -qr Nuvora.zip Nuvora && ls -la Nuvora.zip

      - name: Novedades
        run: |
          ANTERIOR="${{ steps.version.outputs.anterior }}"
          RANGO=$([ -n "$ANTERIOR" ] && echo "$ANTERIOR..HEAD" || echo "HEAD")
          {
            echo "## Novedades"
            echo
            git log --no-merges --format='- %s' $RANGO | head -40
            echo
            echo "## Cómo usarla"
            echo
            echo "1. Descarga **Nuvora.zip** y descomprímelo."
            echo "2. Con Node.js 22.13 o superior: \`cd Nuvora\` y \`npm start\`."
            echo "3. Abre http://localhost:3000"
            echo
            echo "**En el móvil (Android):** instala **Nuvora.apk** y escribe la dirección que aparece en el ordenador"
            echo "al arrancar el servidor («En el móvil: http://…»). El móvil tiene que estar en la misma wifi."
          } > notas.md
          cat notas.md

      - name: Publicar en Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ steps.version.outputs.tag }}"
          gh release create "$V" dist/Nuvora.zip \
            --target "${{ github.sha }}" \
            --title "Nuvora $V" \
            --notes-file notas.md \
            --latest

  # La app de Android: se compila y se añade a la misma versión de Releases
  apk:
    needs: publicar
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Compilar la APK
        run: |
          N="${{ needs.publicar.outputs.numero }}"
          gradle -p android assembleRelease --no-daemon -PversionCode="$N" -PversionName="0.$N"
          cp android/app/build/outputs/apk/release/app-release.apk Nuvora.apk
          ls -la Nuvora.apk

      - name: Añadir a la versión
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.publicar.outputs.tag }}" Nuvora.apk --clobber
