name: Publicar versión

on:
  push:
    branches: [main, 'ccr-832ba140-viul7f']
    # Lo que no cambia la app (el README, etc.) no crea versión nueva
    paths:
      - 'server/**'
      - 'public/**'
      - 'sync/**'
      - 'scripts/**'
      - 'test/**'
      - 'package.json'
      - 'package-lock.json'
      - 'android/**'
      - 'mac/**'
      - '.github/workflows/publicar.yml'
  # A mano: Actions → «Publicar versión» → Run workflow
  workflow_dispatch:

# Dos pushes seguidos se publican uno detrás de otro, nunca a la vez
concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      numero: ${{ steps.version.outputs.numero }}

    steps:
      - uses: actions/checkout@v4
        with:
          # Todo el historial y las etiquetas: para numerar la versión y escribir las novedades
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Si las pruebas fallan no se publica nada
      - run: npm test

      - name: Número de versión
        id: version
        run: |
          ULTIMA=$(git tag -l 'v0.*' | sed 's/^v0\.//' | sort -n | tail -1)
          N=$(( ${ULTIMA:-0} + 1 ))
          echo "tag=v0.$N" >> "$GITHUB_OUTPUT"
          echo "numero=$N" >> "$GITHUB_OUTPUT"
          echo "anterior=${ULTIMA:+v0.$ULTIMA}" >> "$GITHUB_OUTPUT"
          echo "Nueva versión: v0.$N"

      # El ZIP ya lleva node_modules: se descomprime y se arranca con «npm start»
      - name: Preparar el ZIP
        run: |
          V="${{ steps.version.outputs.tag }}"
          npm version --no-git-tag-version --allow-same-version "${V#v}.0"
          rm -rf dist && mkdir -p dist/Nuvora
          cp -r server public sync scripts package.json package-lock.json README.md dist/Nuvora/
          cp -r node_modules dist/Nuvora/
          # Doble clic para arrancar: Windows (.bat) y Mac (.command)
          cp "scripts/Iniciar Nuvora.bat" "scripts/Iniciar Nuvora.command" dist/Nuvora/
          chmod +x "dist/Nuvora/Iniciar Nuvora.command"
          # El servidor saca de aquí el ID de Google (proyecto de Firebase «Nuvora»)
          if [ -f android/app/google-services.json ]; then cp android/app/google-services.json dist/Nuvora/; fi
          cd dist && zip -qr Nuvora.zip Nuvora && ls -la Nuvora.zip

      - name: Novedades
        run: |
          ANTERIOR="${{ steps.version.outputs.anterior }}"
          RANGO=$([ -n "$ANTERIOR" ] && echo "$ANTERIOR..HEAD" || echo "HEAD")
          {
            echo "## Novedades"
            echo
            git log --no-merges --format='- %s' $RANGO | head -40
            echo
            echo "## Cómo usarla"
            echo
            echo "1. Descarga **Nuvora.zip** y descomprímelo (necesitas [Node.js](https://nodejs.org/es/download) 22.13 o superior)."
            echo "2. Abre **Iniciar Nuvora** con doble clic (o \`npm start\` en la carpeta). Se abre http://localhost:3000"
            echo
            echo "**En el móvil (Android):** instala **Nuvora.apk**. Con el móvil en la misma wifi, la app encuentra"
            echo "sola tu Nuvora del ordenador; después entras con tu cuenta de Google."
            echo
            echo "**En el Mac (Apple Silicon):** abre **Nuvora-Mac.dmg** y arrastra Nuvora a Aplicaciones. Lleva todo dentro"
            echo "(no hace falta Node.js). La primera vez: clic derecho → Abrir, o Ajustes del Sistema → Privacidad y seguridad → Abrir igualmente."
          } > notas.md
          cat notas.md

      - name: Publicar en Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ steps.version.outputs.tag }}"
          gh release create "$V" dist/Nuvora.zip \
            --target "${{ github.sha }}" \
            --title "Nuvora $V" \
            --notes-file notas.md \
            --latest

  # La app de Android: se compila y se añade a la misma versión de Releases
  apk:
    needs: publicar
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Compilar la APK
        run: |
          N="${{ needs.publicar.outputs.numero }}"
          gradle -p android assembleRelease --no-daemon -PversionCode="$N" -PversionName="0.$N"
          cp android/app/build/outputs/apk/release/app-release.apk Nuvora.apk
          ls -la Nuvora.apk

      - name: Añadir a la versión
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.publicar.outputs.tag }}" Nuvora.apk --clobber

  # Nuvora para Mac (Apple Silicon): app nativa en Swift con el servidor y Node.js dentro
  mac:
    needs: publicar
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Compilar la app
        run: |
          swiftc -O -target arm64-apple-macos13 mac/main.swift -o Nuvora 2>&1 | tee swift.log
          test -f Nuvora || { grep -E 'error:' swift.log | head -20 | while IFS= read -r l; do echo "::error::$l"; done; exit 1; }

      - name: Montar Nuvora.app
        run: |
          N="${{ needs.publicar.outputs.numero }}"
          APP=dist/Nuvora.app
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources/servidor"
          mv Nuvora "$APP/Contents/MacOS/Nuvora"
          sed -e "s/__VERSION__/0.$N/" -e "s/__BUILD__/$N/" mac/Info.plist > "$APP/Contents/Info.plist"

          # Icono
          mkdir AppIcon.iconset
          for t in 16 32 128 256 512; do
            sips -z $t $t mac/AppIcon.png --out "AppIcon.iconset/icon_${t}x${t}.png" >/dev/null
            sips -z $((t*2)) $((t*2)) mac/AppIcon.png --out "AppIcon.iconset/icon_${t}x${t}@2x.png" >/dev/null
          done
          iconutil -c icns AppIcon.iconset -o "$APP/Contents/Resources/AppIcon.icns"

          # El servidor de Nuvora con sus dependencias
          npm ci --omit=dev
          npm version --no-git-tag-version --allow-same-version "0.$N.0"
          cp -R server public sync scripts package.json node_modules "$APP/Contents/Resources/servidor/"
          if [ -f android/app/google-services.json ]; then cp android/app/google-services.json "$APP/Contents/Resources/servidor/"; fi

          # Node.js 22 oficial para Apple Silicon
          NODE=$(curl -fsSL https://nodejs.org/dist/latest-v22.x/SHASUMS256.txt | awk '/darwin-arm64.tar.gz/ {print $2}')
          curl -fsSL -o node.tgz "https://nodejs.org/dist/latest-v22.x/$NODE"
          tar -xzf node.tgz
          mkdir -p "$APP/Contents/Resources/node/bin"
          cp "${NODE%.tar.gz}/bin/node" "$APP/Contents/Resources/node/bin/node"
          cp "${NODE%.tar.gz}/LICENSE" "$APP/Contents/Resources/node/LICENSE"
          "$APP/Contents/Resources/node/bin/node" --version

      # Prueba de humo: abrir la app y comprobar que su servidor arranca y responde
      - name: Probar la app
        run: |
          open dist/Nuvora.app
          for i in $(seq 1 40); do
            if curl -fsS http://localhost:3000/api/config | grep -q '"nuvora":true'; then echo "✓ El servidor de la app responde"; OK=1; break; fi
            sleep 1
          done
          curl -fsS -X POST -H 'Content-Type: application/json' -d '{"name":"Prueba","email":"prueba@nuvora.app","password":"contraseña-larga","client":"ci"}' http://localhost:3000/api/auth/register | grep -q token && echo "✓ Se puede crear una cuenta"
          ls ~/Library/Logs/Nuvora/ && tail -5 ~/Library/Logs/Nuvora/servidor.log || true
          pkill -x Nuvora || true
          sleep 2
          rm -rf ~/Library/Application\ Support/Nuvora
          [ "${OK:-}" = 1 ] || { echo "::error::La app no arrancó su servidor"; exit 1; }

      # Firma ad hoc (como Memories); con un certificado de Apple en MAC_IDENTIDAD se firmaría con él
      - name: Firmar y crear el .dmg
        env:
          MAC_IDENTIDAD: ${{ secrets.MAC_IDENTIDAD }}
        run: |
          APP=dist/Nuvora.app
          FIRMA="${MAC_IDENTIDAD:--}"
          codesign --force --sign "$FIRMA" "$APP/Contents/Resources/node/bin/node"
          codesign --force --sign "$FIRMA" "$APP"
          codesign --verify --deep --strict "$APP"
          mkdir dmg && cp -R "$APP" dmg/ && ln -s /Applications dmg/Aplicaciones
          hdiutil create -volname "Nuvora" -srcfolder dmg -ov -format UDZO Nuvora-Mac.dmg
          ls -la Nuvora-Mac.dmg

      - name: Añadir a la versión
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.publicar.outputs.tag }}" Nuvora-Mac.dmg --clobber
